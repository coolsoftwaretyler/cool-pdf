appId: expo.modules.coolpdf.example
---
# Test: Basic No Cache
# Category: Loading
# Description: Tests loading a PDF from a URL without caching

# Test CoolPDF implementation using deep link
- openLink: coolpdf://basic-no-cache-cool
- waitForAnimationToEnd

# Verify we're on the CoolPDF screen
- assertVisible: "CoolPDF Implementation"

# Wait for PDF to load
- waitForAnimationToEnd:
    timeout: 10000

# Assert no error occurred
- assertNotVisible:
    text: "Error"
    optional: true

# Capture screenshot of CoolPDF implementation
- takeScreenshot: /tmp/maestro-screenshots/basic-no-cache-coolpdf

# Test react-native-pdf implementation
- openLink: coolpdf://basic-no-cache-rnpdf
- waitForAnimationToEnd

# Verify we're on the react-native-pdf screen
- assertVisible: "react-native-pdf Implementation"

# Wait for PDF to load
- waitForAnimationToEnd:
    timeout: 10000

# Assert no error occurred
- assertNotVisible:
    text: "Error"
    optional: true

# Capture screenshot of react-native-pdf implementation
- takeScreenshot: /tmp/maestro-screenshots/basic-no-cache-rnpdf